services:
  api:
    build: .
    container_name: bookshelf-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/bookshelf_db
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: bookshelf-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bookshelf_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: